<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- No SVG filters: `tauri icon` renders this with banded gradients, so the PNGs are made from a
       1024px PNG of it rendered by macOS (NSImage, which ignores filters), then `npx tauri icon that.png`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a3a"/>
      <stop offset="1" stop-color="#0b0c12"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-pink"><stop offset=".5" stop-color="#ff2d78" stop-opacity=".38"/><stop offset="1" stop-color="#ff2d78" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-cyan"><stop offset=".5" stop-color="#22c3e6" stop-opacity=".38"/><stop offset="1" stop-color="#22c3e6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-amber"><stop offset=".5" stop-color="#ffb020" stop-opacity=".38"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- macOS squircle: 824px body on the 1024 grid -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="3"/>

  <!-- running order: song colour + title; the current song is selected, with the playhead on it -->
  <rect x="150" y="420" width="724" height="184" rx="52" fill="#ffffff" fill-opacity=".11"/>
  <circle cx="322" cy="340" r="112" fill="url(#glow-pink)"/>
  <circle cx="322" cy="512" r="112" fill="url(#glow-cyan)"/>
  <circle cx="322" cy="684" r="112" fill="url(#glow-amber)"/>

  <rect x="252" y="270" width="140" height="140" rx="38" fill="#ff2d78"/>
  <rect x="436" y="318" width="320" height="44" rx="22" fill="#ffffff" fill-opacity=".45"/>

  <rect x="252" y="442" width="140" height="140" rx="38" fill="#22c3e6"/>
  <rect x="436" y="490" width="392" height="44" rx="22" fill="#ffffff"/>

  <rect x="252" y="614" width="140" height="140" rx="38" fill="#ffb020"/>
  <rect x="436" y="662" width="256" height="44" rx="22" fill="#ffffff" fill-opacity=".45"/>

  <path d="M196 482 l34 24 a7 7 0 0 1 0 12 l-34 24 a7 7 0 0 1 -11 -6 v-48 a7 7 0 0 1 11 -6z" fill="#ffffff"/>
</svg>
