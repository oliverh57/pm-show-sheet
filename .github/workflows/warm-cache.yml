# Fills the Rust and npm caches that release.yml reads. Caches saved by a tag run are only visible to that tag,
# so every release started cold; caches saved on main are visible to every tag.
name: Warm build cache

on:
  push:
    branches: [main]
    paths:
      - app/src-tauri/Cargo.lock
      - app/package-lock.json
      - .github/workflows/warm-cache.yml
  # Unused caches are evicted after 7 days, and a new stable Rust changes the key.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  # Release commits bump the app's own version in Cargo.lock, which doesn't change the cache key; skip those.
  check:
    runs-on: macos-latest
    outputs:
      cache-hit: ${{ steps.rust-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          shared-key: release
          lookup-only: true
          save-if: false

  warm:
    needs: check
    if: needs.check.outputs.cache-hit != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          shared-key: release

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Same command as release.yml, so the cached dependencies are built with the same targets and features.
      - name: Build universal app
        working-directory: app
        run: npm run tauri build -- --target universal-apple-darwin --bundles app
