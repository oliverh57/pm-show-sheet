# Builds, signs and publishes PM Show Sheet whenever a version tag is pushed (scripts/release.sh does that).
# Installed apps pick the release up through latest.json; new installs get it from install.sh.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # A tag run can only read caches saved on its own tag or on main, so warm-cache.yml fills this one from main.
      # Saving here would store a cache that no later tag can read.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          shared-key: release
          save-if: false

      - name: Install rcodesign
        run: |
          ASSET=apple-codesign-0.29.0-macos-universal
          curl -fsSL -o "$RUNNER_TEMP/$ASSET.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/$ASSET.tar.gz"
          echo "d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d  $RUNNER_TEMP/$ASSET.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$ASSET.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p ~/.cargo/bin
          install -m 755 "$RUNNER_TEMP/$ASSET/rcodesign" ~/.cargo/bin/rcodesign

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build universal app
        working-directory: app
        env:
          # The Google sign-in client (a "Desktop app" OAuth client). If these are unset, each Mac picks the client file once.
          PM_GOOGLE_CLIENT_ID: ${{ secrets.PM_GOOGLE_CLIENT_ID }}
          PM_GOOGLE_CLIENT_SECRET: ${{ secrets.PM_GOOGLE_CLIENT_SECRET }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app

      - name: Sign and package
        env:
          PMSS_CODESIGN_P12: ${{ secrets.PMSS_CODESIGN_P12 }}
          PMSS_CODESIGN_P12_PASSWORD: ${{ secrets.PMSS_CODESIGN_P12_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # checkout leaves a lightweight tag (so %(contents) would be the commit message); fetch the annotated one with the notes.
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          scripts/package-release.sh "$VERSION" "$NOTES"
          printf '%s' "$NOTES" > dist/release/notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/PM-Show-Sheet.app.tar.gz \
            dist/release/PM-Show-Sheet.app.tar.gz.sig \
            dist/release/latest.json \
            --title "PM Show Sheet ${GITHUB_REF_NAME}" \
            --notes-file dist/release/notes.md
